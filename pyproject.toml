[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "subjectdesk"
version = "0.1.0"
description = "Turn subject-folder assignments into researched documents with Claude"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bogdan Stamenovic" }]
dependencies = [
  "anthropic>=0.64,<1",
  "python-docx>=1.2,<2",
  "pypdf>=6,<7",
  "reportlab>=4.4,<5",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6,<1", "mypy>=1.11,<3", "pytest-cov>=5,<7", "types-PyYAML", "types-reportlab"]

[project.scripts]
subjectdesk = "subjectdesk.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/subjectdesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
